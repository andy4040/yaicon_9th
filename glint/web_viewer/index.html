<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GLINT · Scene 3</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#11151b;color:#edf2fa;font:14px system-ui,sans-serif}header{min-height:76px;padding:16px 24px;display:flex;gap:16px;align-items:center;flex-wrap:wrap;border-bottom:1px solid #303844}h1{font-size:19px;margin:0}small{color:#9caec2}select,button{font:inherit;color:inherit;background:#242c37;border:1px solid #485363;border-radius:7px;padding:8px}button{cursor:pointer}button:hover{background:#344255}.brand{margin-right:auto}.brand small{display:block;margin-top:5px}label{display:flex;gap:7px;align-items:center}#stage{height:calc(100dvh - 128px);min-height:250px;position:relative;overflow:hidden;cursor:grab;touch-action:none;background:#080a0d}#stage:active{cursor:grabbing}#frame{width:100%;height:100%;object-fit:fill;pointer-events:none;display:none}#message{position:absolute;inset:0;display:grid;place-items:center;color:#b5c6db;pointer-events:none}footer{padding:12px 24px;display:flex;justify-content:space-between;gap:16px;color:#aebed1;font-size:12px}#state{color:#92d5bd}@media(max-width:850px){header{padding:12px;gap:8px}#stage{height:65dvh}footer{padding:10px;flex-wrap:wrap}.brand{width:100%}}
</style></head><body>
<header><div class="brand"><h1>GLINT <span style="color:#91baff">/ Scene 3</span></h1><small id="checkpoint">체크포인트 연결 중</small></div>
<label>보기 <select id="mode"><option value="final">최종 렌더링</option><option value="general" selected>일반 GS</option><option value="optical">광학 coverage</option><option value="reflection">반사 성분</option><option value="transmission">투과 성분</option></select></label>
<label>해상도 <select id="resolution"><option>360</option><option selected>480</option><option>720</option><option>960</option></select></label>
<label>시점 <select id="preset"></select></label><button id="reset">시점으로 이동</button></header>
<main id="stage" aria-label="마우스로 회전할 수 있는 가우시안 장면"><img id="frame" alt="두 집합 가우시안 렌더링"><div id="message">모델을 불러오는 중…</div></main>
<footer><span>드래그: 회전 · 우클릭/Shift 드래그: 이동 · 휠: 확대/축소</span><span id="state">대기</span></footer>
<script>
const $=id=>document.getElementById(id),stage=$('stage');let camera,config,dirty=true,busy=false,drag=null,url=null;
const add=(a,b)=>a.map((v,i)=>v+b[i]),sub=(a,b)=>a.map((v,i)=>v-b[i]),mul=(a,s)=>a.map(v=>v*s),dot=(a,b)=>a.reduce((s,v,i)=>s+v*b[i],0),cross=(a,b)=>[a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]],norm=a=>Math.hypot(...a),unit=a=>mul(a,1/Math.max(norm(a),1e-10));
function rotate(v,axis,angle){const c=Math.cos(angle),s=Math.sin(angle);return add(add(mul(v,c),mul(cross(axis,v),s)),mul(axis,dot(axis,v)*(1-c)));}
function reset(){camera=structuredClone(config.presets[Number($('preset').value)]);dirty=true;}
$('reset').onclick=reset;$('preset').onchange=reset;$('mode').onchange=$('resolution').onchange=()=>dirty=true;
stage.oncontextmenu=e=>e.preventDefault();
stage.onpointerdown=e=>{stage.setPointerCapture(e.pointerId);drag={x:e.clientX,y:e.clientY,pan:e.button===2||e.shiftKey};};
stage.onpointerup=stage.onpointercancel=()=>drag=null;
stage.onpointermove=e=>{if(!drag||!camera)return;const dx=e.clientX-drag.x,dy=e.clientY-drag.y;drag.x=e.clientX;drag.y=e.clientY;let offset=sub(camera.position,camera.target);const up=unit(camera.up),right=unit(cross(mul(offset,-1),up));if(drag.pan){const scale=norm(offset)*2*Math.tan(camera.fov/2)/stage.clientHeight;const shift=add(mul(right,-dx*scale),mul(up,dy*scale));camera.position=add(camera.position,shift);camera.target=add(camera.target,shift);}else{offset=rotate(offset,up,-dx*.005);const r=unit(cross(mul(offset,-1),up)),pitch=rotate(offset,r,-dy*.005);if(Math.abs(dot(unit(pitch),up))<.99)offset=pitch;camera.position=add(camera.target,offset);}dirty=true;};
stage.addEventListener('wheel',e=>{e.preventDefault();if(!camera)return;const offset=sub(camera.position,camera.target);camera.position=add(camera.target,mul(offset,Math.exp(Math.max(-200,Math.min(200,e.deltaY))*.0015)));dirty=true;},{passive:false});
new ResizeObserver(()=>dirty=true).observe(stage);
async function render(){if(!camera||busy||!dirty)return;dirty=false;busy=true;$('state').textContent='렌더링 중…';let width=Number($('resolution').value),height=Math.round(width*stage.clientHeight/stage.clientWidth);if(height>960){width=Math.round(width*960/height);height=960;}width=Math.max(64,width);height=Math.max(64,height);try{const response=await fetch('/render',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({...camera,width,height,mode:$('mode').value})});if(!response.ok)throw Error(await response.text());const next=URL.createObjectURL(await response.blob());$('frame').src=next;$('frame').style.display='block';$('message').style.display='none';if(url)URL.revokeObjectURL(url);url=next;$('state').textContent=`${width} × ${height} · GPU ${response.headers.get('X-Render-Ms')} ms · 저장된 체크포인트`;}catch(error){$('message').style.display='grid';$('message').textContent='연결 오류: '+error.message;$('state').textContent='다시 움직이거나 시점으로 이동을 눌러 재시도';}finally{busy=false;}}
fetch('/config').then(r=>{if(!r.ok)throw Error('설정 연결 실패');return r.json();}).then(data=>{config=data;$('checkpoint').textContent=`${data.step.toLocaleString()} step · 일반 ${data.general.toLocaleString()} / 광학 ${data.optical.toLocaleString()} · 저장 시점 고정`;$('preset').replaceChildren(...data.presets.map((p,i)=>new Option(p.name,i)));const query=new URLSearchParams(location.search);const chosen=data.presets.findIndex(p=>p.name===(query.get('camera')||'0064'));if(chosen>=0)$('preset').value=chosen;if(query.has('mode'))$('mode').value=query.get('mode');reset();render();}).catch(e=>{$('message').textContent=e.message;});
setInterval(render,200);
</script></body></html>
